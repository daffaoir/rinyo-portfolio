  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const typedEl = document.getElementById("typed");
    const text = "Building something new.";
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (prefersReducedMotion) {
      typedEl.textContent = text;
    } else {
      const TYPE_SPEED = 70;
      const DELETE_SPEED = 40;
      const PAUSE_AFTER_TYPE = 2000;
      const PAUSE_AFTER_DELETE = 500;
      let i = 0;

      function type() {
        if (i < text.length) {
          i++;
          typedEl.textContent = text.slice(0, i);
          setTimeout(type, TYPE_SPEED);
        } else {
          setTimeout(erase, PAUSE_AFTER_TYPE);
        }
      }

      function erase() {
        if (i > 0) {
          i--;
          typedEl.textContent = text.slice(0, i);
          setTimeout(erase, DELETE_SPEED);
        } else {
          setTimeout(type, PAUSE_AFTER_DELETE);
        }
      }

      type();
    }

    if (!prefersReducedMotion) {
      const glowWrap = document.querySelector(".glow-wrap");
      const MAX_OFFSET = 90;
      window.addEventListener("mousemove", (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 2 * MAX_OFFSET;
        const y = (e.clientY / window.innerHeight - 0.5) * 2 * MAX_OFFSET;
        glowWrap.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
      });
    }
  </script>
